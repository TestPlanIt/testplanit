packages:
  - 'testplanit'
  - 'docs'
  - 'forge-app'
  - 'cli'
  - 'packages/*'

# Supply-chain cooling-off disabled; pre-merge CI is the supply-chain gate.
minimumReleaseAge: 0

# Packages permitted to run install/build lifecycle scripts. pnpm 11 replaces
# package.json#pnpm.onlyBuiltDependencies with this allowBuilds map.
allowBuilds:
  '@forge/cli': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  'aws-sdk': true
  'bcrypt': true
  'canvas': true
  'cloudflared': true
  'core-js': true
  'core-js-pure': true
  'esbuild': true
  iframe-resizer: true
  'keytar': true
  'msgpackr-extract': true
  'msw': true
  'prisma': true
  'sharp': true
  'tree-sitter': true
  'tree-sitter-json': true
  'unrs-resolver': true
  'zenstack': true

# Pinned transitive dependency versions (moved from package.json#pnpm.overrides;
# pnpm 11 no longer reads the pnpm field in package.json).
