version: 2
updates:
  # Single npm entry for the pnpm workspace. The root pnpm-lock.yaml is the
  # source of truth for testplanit, cli, packages/*, docs, and forge-app —
  # per-subdirectory entries produced stale-lockfile PRs because Dependabot's
  # per-subdir mode doesn't update the shared root lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@zenstackhq/server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@zenstackhq/tanstack-query"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is held: typescript-eslint refuses to load against it
      # ("typescript-eslint does not support TS 7.0"), so `pnpm lint` dies
      # before any test runs and the whole grouped PR fails its required check.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # Pinned to 9.x on purpose (#616). The 10.x line requires
      # conventional-changelog-writer@9, but semantic-release 25 bundles
      # @semantic-release/release-notes-generator 14, which depends on writer
      # ^8 — the two cannot agree, and generateNotes dies with
      # `Missing helper: ... requires conventional-changelog-writer@9 or newer`,
      # blocking every app release. Only unhold this alongside a
      # semantic-release major that ships a writer-9 generator.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@types/node"
      minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
