name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**', 'release/**', 'users/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: [self-hosted]
    # Skip CI on release commits from semantic-release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      # env.js (t3-env) validates DATABASE_URL at import time with
      # emptyStringAsUndefined: true, so an unset or empty secret crashes
      # any test that transitively imports the prisma client (3 review
      # specs currently). The placeholder satisfies Zod; unit tests mock
      # prisma anyway, and integration tests that need a real DB get the
      # real secret when it's configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://testplanit.test' }}
      NODE_OPTIONS: "--max-old-space-size=12288"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify workspace lockfile mirror
        # testplanit/pnpm-lock.yaml is a load-bearing byte-for-byte duplicate
        # of the root pnpm-lock.yaml — the testplanit Dockerfile copies it
        # from its build context. Fail loudly when they diverge (typically
        # after a Dependabot bump) so the mirror is fixed before merge.
        run: diff -q pnpm-lock.yaml testplanit/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd testplanit
          pnpm install --ignore-scripts

      - name: Generate ZenStack and Prisma
        run: |
          cd testplanit
          pnpm zenstack generate
          pnpm prisma generate

      - name: Check formatting
        run: |
          cd testplanit
          pnpm format:check

      - name: Run linter
        run: |
          cd testplanit
          pnpm lint

      - name: Run unit tests
        run: |
          cd testplanit
          pnpm test run

      # packages/api and cli are pnpm workspace members — they were already
      # installed by the workspace-aware install above. No second install
      # step needed.
      - name: Run packages unit tests
        run: pnpm test run
        working-directory: packages/api

      - name: Run CLI unit tests
        run: pnpm test
        working-directory: cli