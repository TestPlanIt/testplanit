name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**', 'release/**', 'users/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: [self-hosted]
    # Skip CI on release commits from semantic-release
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    env:
      # env.js (t3-env) validates DATABASE_URL at import time with
      # emptyStringAsUndefined: true, so an unset or empty secret crashes
      # any test that transitively imports the prisma client (3 review
      # specs currently). The placeholder satisfies Zod; unit tests mock
      # prisma anyway, and integration tests that need a real DB get the
      # real secret when it's configured.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://testplanit.test' }}
      NODE_OPTIONS: "--max-old-space-size=12288"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        # --frozen-lockfile is the pre-merge lockfile-integrity gate: it fails
        # fast if the root pnpm-lock.yaml has drifted from the manifests (e.g. a
        # Dependabot bump that didn't regenerate it), matching the frozen install
        # the release Docker build relies on. A non-frozen install would silently
        # rewrite the lockfile in-runner and pass, deferring the failure to release.
        run: |
          cd testplanit
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate ZenStack client
        run: |
          cd testplanit
          pnpm exec zenstack generate --schema schema.zmodel -o zenstack

      - name: Check formatting
        run: |
          cd testplanit
          pnpm format:check

      - name: Run linter
        run: |
          cd testplanit
          pnpm lint

      - name: Run unit tests
        run: |
          cd testplanit
          pnpm test run

      # packages/api and cli are pnpm workspace members — they were already
      # installed by the workspace-aware install above. No second install
      # step needed.
      - name: Run packages unit tests
        run: pnpm test run
        working-directory: packages/api

      - name: Run CLI unit tests
        run: pnpm test
        working-directory: cli