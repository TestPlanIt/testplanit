# Releases @testplanit/cli via semantic-release.
#
# `main` cuts normal releases to the `latest` npm tag. `beta` is configured in
# cli/.releaserc.json as a prerelease branch, so pushes there cut `1.x.y-beta.N`
# under the `beta` npm tag instead — matching the beta channel the packages/*
# workspace publishes through packages-release.yml. Testers opt in with
# `npm i @testplanit/cli@beta`; `@latest` is untouched.
#
# Versions are computed by semantic-release from conventional commits, NOT set
# by hand: a `feat` on beta over the 1.3.0 baseline yields 1.4.0-beta.1 (its
# prerelease counter starts at 1). A push with no releasable commits publishes
# nothing.
#
# Both branches release from THIS workflow file on purpose — npm trusted
# publishing (OIDC) authorizes a single workflow filename per package.
name: CLI Semantic Release

on:
  workflow_dispatch:
  push:
    branches: [main, beta]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-semantic-release.yml'
      - '.github/workflows/cli-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  release:
    name: CLI Release
    runs-on: ubuntu-latest
    # Skip release commits
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install CLI dependencies
        run: |
          cd cli
          pnpm install --ignore-scripts

      - name: Install semantic-release
        run: |
          cd cli
          pnpm add -D semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 24 ships
      # npm 11.x, but pin to latest so the OIDC handshake can't silently fall
      # back to anonymous auth. Mirrors packages-release.yml.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # No NPM_TOKEN — @testplanit/cli publishes via OIDC trusted publishing
          # (id-token: write above + the trusted publisher configured on npm).
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          cd cli
          npx semantic-release 2>&1 | tee release-output.txt
          # Extract the version if a release was made (portable across Linux/macOS)
          if grep -q "Published release" release-output.txt; then
            # Use sed instead of grep -oP for cross-platform compatibility.
            # The pre-release suffix must be part of the capture: beta releases
            # are tagged cli-v1.4.0-beta.1, so truncating to 1.4.0 would point
            # the binary build at a tag that was never created.
            VERSION=$(grep "Published release" release-output.txt | sed -E 's/.*Published release ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?).*/\1/' | head -1)
            if [ -n "$VERSION" ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "version=cli-v${VERSION}" >> $GITHUB_OUTPUT
              echo "released=true" >> $GITHUB_OUTPUT
            else
              echo "Warning: Found 'Published release' but could not extract version number"
              echo "released=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger CLI binary build
        if: steps.release.outputs.released == 'true' && steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [[ "$VERSION" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Triggering CLI binary build for version: $VERSION"
            gh workflow run cli-release.yml -f tag=$VERSION
          else
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi
