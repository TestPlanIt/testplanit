name: CLI Semantic Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - '.github/workflows/cli-semantic-release.yml'
      - '.github/workflows/cli-release.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

jobs:
  release:
    name: CLI Release
    runs-on: ubuntu-latest
    # Skip release commits
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install CLI dependencies
        run: |
          cd cli
          pnpm install --ignore-scripts

      - name: Install semantic-release
        run: |
          cd cli
          pnpm add -D semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 24 ships
      # npm 11.x, but pin to latest so the OIDC handshake can't silently fall
      # back to anonymous auth. Mirrors packages-release.yml.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # No NPM_TOKEN — @testplanit/cli publishes via OIDC trusted publishing
          # (id-token: write above + the trusted publisher configured on npm).
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          cd cli
          npx semantic-release 2>&1 | tee release-output.txt
          # Extract the version if a release was made (portable across Linux/macOS)
          if grep -q "Published release" release-output.txt; then
            # Use sed instead of grep -oP for cross-platform compatibility
            VERSION=$(grep "Published release" release-output.txt | sed -E 's/.*Published release ([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | head -1)
            if [ -n "$VERSION" ] && [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version=cli-v${VERSION}" >> $GITHUB_OUTPUT
              echo "released=true" >> $GITHUB_OUTPUT
            else
              echo "Warning: Found 'Published release' but could not extract version number"
              echo "released=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger CLI binary build
        if: steps.release.outputs.released == 'true' && steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          if [[ "$VERSION" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Triggering CLI binary build for version: $VERSION"
            gh workflow run cli-release.yml -f tag=$VERSION
          else
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi
