# Crowdin Sync Workflow
#
# Automatically syncs locale files whenever en-US.json changes on main.
# Uploads the updated source, triggers machine translation, downloads all
# translated locale files, then commits them back to main with [skip ci].
#
# Requires the CROWDIN_PERSONAL_TOKEN secret to be set in repository settings.
#
name: Crowdin Sync

on:
  push:
    branches: [main]
    paths:
      - 'testplanit/messages/en-US.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync locale files
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"

    env:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli@4

      - name: Upload sources
        working-directory: testplanit
        run: crowdin upload sources

      # Push the repo's locale files back into Crowdin as approved translations
      # before pre-translating. Hand-corrected strings in messages/*.json are
      # otherwise invisible to Crowdin, so the next `crowdin download` would
      # overwrite them with whatever the MT engine produced.
      - name: Upload corrected translations
        working-directory: testplanit
        run: crowdin upload translations --auto-approve-imported

      # --translate-untranslated-only keeps MT off strings that already have a
      # translation. Without it the engine re-translates approved strings and
      # re-introduces defects like localizing the ICU `#` count placeholder
      # ("See # Test Cases" -> "Voir tous les cas de test n°"), which silently
      # drops the number from the rendered message.
      - name: Pre-translate via machine translation
        working-directory: testplanit
        run: |
          crowdin pre-translate \
            --method=mt \
            --engine-id=609928 \
            --translate-untranslated-only

      - name: Download translations
        working-directory: testplanit
        run: crowdin download

      - name: Commit updated locale files
        id: commit
        working-directory: testplanit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/*.json
          if git diff --cached --quiet; then
            echo "Locale files already up to date, nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(i18n): sync locale files [skip ci]"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # The locale commit carries [skip ci], and it advances main after the
      # merge that triggered Semantic Release — which then aborts as "behind the
      # remote". Re-dispatch the release against the now-current main so it ships
      # with the freshly synced translations. Must use the PAT: the default
      # GITHUB_TOKEN is barred from triggering workflow_dispatch.
      - name: Trigger release with synced translations
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh workflow run semantic-release.yml --ref main --repo "${{ github.repository }}"
