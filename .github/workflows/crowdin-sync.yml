# Crowdin Sync Workflow
#
# Automatically syncs locale files whenever en-US.json changes on main.
# Uploads the updated source, triggers machine translation, downloads all
# translated locale files, then commits them back to main with [skip ci].
#
# Requires the CROWDIN_PERSONAL_TOKEN secret to be set in repository settings.
#
name: Crowdin Sync

on:
  push:
    branches: [main]
    paths:
      - 'testplanit/messages/en-US.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync locale files
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"

    env:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli@5

      # Push the repo's locale files back into Crowdin as approved translations.
      # Hand-corrected strings in messages/*.json are otherwise invisible to
      # Crowdin, so the next `crowdin download` would overwrite them with
      # whatever the translation engine produced.
      #
      # This runs BEFORE the source upload. The repo's translations correspond
      # to the English currently in Crowdin, so they must land while that is
      # still the old source. Uploading sources first clears the translations
      # of every changed string, and this step would immediately restore the
      # stale text and approve it -- leaving auto-translate nothing to do and
      # freezing edits to existing keys in every locale.
      - name: Upload corrected translations
        working-directory: testplanit
        run: crowdin upload translations

      # Clears translations for strings whose English changed, leaving the rest
      # (including the corrections uploaded above) intact.
      - name: Upload sources
        working-directory: testplanit
        run: crowdin upload sources

      # Uses the AI method, matching `crowdin:sync` in testplanit/package.json.
      # The MT engine (609928) rendered ICU's `#` count placeholder as a literal
      # number sign and translated it -- "See # Test Cases" became "Voir tous
      # les cas de test n°" -- which silently drops the number from the message.
      # The AI prompt preserves `#` and named arguments, and picks the right
      # CLDR plural categories per locale.
      #
      # --scope untranslated leaves already-translated strings alone, so a
      # re-run can never revisit (and re-break) an existing translation.
      - name: Auto-translate via AI
        working-directory: testplanit
        run: |
          crowdin auto-translate \
            --method=ai \
            --ai-prompt=536391 \
            --scope untranslated

      - name: Download translations
        working-directory: testplanit
        run: crowdin download

      - name: Commit updated locale files
        id: commit
        working-directory: testplanit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/*.json
          if git diff --cached --quiet; then
            echo "Locale files already up to date, nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(i18n): sync locale files [skip ci]"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # The locale commit carries [skip ci], and it advances main after the
      # merge that triggered Semantic Release — which then aborts as "behind the
      # remote". Re-dispatch the release against the now-current main so it ships
      # with the freshly synced translations. Must use the PAT: the default
      # GITHUB_TOKEN is barred from triggering workflow_dispatch.
      - name: Trigger release with synced translations
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh workflow run semantic-release.yml --ref main --repo "${{ github.repository }}"
