# Crowdin Sync Workflow
#
# Automatically syncs locale files whenever en-US.json changes on main or a
# release branch. Uploads the updated source, triggers machine translation,
# downloads all translated locale files, then commits them back to the same
# branch with [skip ci].
#
# main syncs to the Crowdin project root and each release/vX.Y branch to the
# Crowdin branch vX.Y; testplanit/scripts/crowdin.sh picks the target and the
# upload order.
#
# Requires the CROWDIN_PERSONAL_TOKEN secret to be set in repository settings.
#
name: Crowdin Sync

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'testplanit/messages/en-US.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowdin-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync locale files
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')"

    env:
      CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Crowdin CLI
        run: npm install -g @crowdin/cli@5

      # Uploads the repo's corrected translations, then the sources, then
      # auto-translates new strings via AI and downloads every locale.
      - name: Sync with Crowdin
        working-directory: testplanit
        run: sh scripts/crowdin.sh sync

      - name: Commit updated locale files
        id: commit
        working-directory: testplanit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add messages/*.json
          if git diff --cached --quiet; then
            echo "Locale files already up to date, nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(i18n): sync locale files [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # The locale commit carries [skip ci], and it advances the branch after
      # the push that triggered Semantic Release — which then aborts as "behind
      # the remote". Re-dispatch the release against the now-current branch so it
      # ships with the freshly synced translations. Must use the PAT: the default
      # GITHUB_TOKEN is barred from triggering workflow_dispatch.
      - name: Trigger release with synced translations
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh workflow run semantic-release.yml --ref "$GITHUB_REF_NAME" --repo "${{ github.repository }}"
