# Package Release Workflow
#
# This workflow handles versioning and publishing of @testplanit/* packages to npm.
# It uses Changesets to manage versions and changelogs.
#
# How it works:
# 1. When PRs with changesets are merged to main, this workflow runs
# 2. It creates/updates a "Version Packages" PR with version bumps and changelog updates
# 3. When the "Version Packages" PR is merged, packages are published to npm
#
# To release:
# 1. Create a changeset: pnpm changeset
# 2. Commit and merge to main
# 3. Review and merge the auto-created "Version Packages" PR
#
# @testplanit/cli lives outside packages/ and is released by
# cli-semantic-release.yml — it is not part of this workflow.
#
# npm trusted publishing (OIDC) authorizes a single workflow filename per
# package, and it is this one: every publish path must live in THIS file, or
# it falls back to anonymous auth and E404.
name: Package Release

on:
  push:
    branches:
      - main
      # release/v1.1 publishes pre-releases under the `beta` dist-tag; see the
      # "Publish beta pre-releases" step and packages-publish-prerelease.mjs.
      - release/v1.1
    paths:
      - 'packages/**'
      - '.changeset/**'
      - '.github/workflows/packages-release.yml'
      # The publish command lives here; a fix to it must be able to trigger a run.
      - '.github/scripts/packages-publish.mjs'
      - '.github/scripts/packages-publish-prerelease.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Generate ZenStack client
        run: pnpm --filter "testplanit" exec zenstack generate --schema schema.zmodel -o zenstack

      - name: Run package tests
        run: |
          pnpm --filter "@testplanit/api" test -- --run
          pnpm --filter "@testplanit/wdio-reporter" test -- --run
          pnpm --filter "@testplanit/playwright-reporter" test -- --run
          pnpm --filter "@testplanit/mcp-server" test -- --run

      - name: Build packages
        run: |
          pnpm --filter "@testplanit/api" build
          pnpm --filter "@testplanit/wdio-reporter" build
          pnpm --filter "@testplanit/playwright-reporter" build
          pnpm --filter "@testplanit/mcp-server" build

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 24 ships
      # npm 11.x, but pin to latest so the OIDC handshake can't silently fall
      # back to anonymous auth — the cause of E404 on scoped-package publishes.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # v2 of the action pairs with @changesets/cli v3: the CLI reports published
      # packages through the CHANGESETS_OUTPUT file the action provides, not via
      # "New tag:" stdout lines (v1 parsed those and would see nothing published).

      # Pre-releases from a release branch: only packages/* whose version
      # carries a pre-release identifier (e.g. 1.1.0-beta.0) are published,
      # under the `beta` dist-tag, and only if that exact version is not on
      # npm yet. Same workflow file as the main path on purpose — npm trusted
      # publishing authorizes one workflow filename per package.
      - name: Publish beta pre-releases
        if: github.ref_name != 'main'
        run: node .github/scripts/packages-publish-prerelease.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        if: github.ref_name == 'main'
        uses: changesets/action@v2
        with:
          # Wrapper for `pnpm changeset publish` that hides @testplanit/cli from
          # the publish (cli is released by its own cli-semantic-release.yml
          # pipeline; changeset publish ignores the changesets `ignore` list and
          # would otherwise crash trying to republish it). See the script header.
          # Must stay a single command: the changesets action tokenizes this
          # input rather than running it through a shell, so a multi-line block
          # or shell operators do NOT work here.
          publish-script: node .github/scripts/packages-publish.mjs
          version-script: pnpm changeset version
          pr-title: 'chore(packages): version packages'
          commit-message: 'chore(packages): version packages'
          create-github-releases: true
          # No NPM_TOKEN — publishing authenticates via OIDC trusted publishing
          # (id-token: write above + the trusted publisher configured on npm).

      - name: Summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "## Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following packages were published:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.changesets.outputs.published-packages }}' | jq -r '.[] | "- \(.name)@\(.version)"' >> $GITHUB_STEP_SUMMARY
