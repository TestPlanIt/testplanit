# Docs Release Workflow
#
# Builds and pushes a docs Docker image to GHCR. Every release line is its own
# site, built from its own branch or tag (see docs/README.md, Deployment):
#
#   main          -> ghcr.io/testplanit/testplanit:docs        https://docs.testplanit.com
#   release/vX.Y  -> ghcr.io/testplanit/testplanit:docs-vX.Y   https://docs-vX-Y.testplanit.com
#   tag vX.Y.Z    -> ghcr.io/testplanit/testplanit:docs-vX.Y   https://docs-vX-Y.testplanit.com
#
# Hosts stay one level below testplanit.com so the zone's wildcard DNS record,
# the universal TLS certificate and the tunnel's wildcard route all cover them.
#
# Triggers on pushes to main or a release branch that change docs/, or
# manually via GitHub Actions UI (pass a tag as `ref` to publish a frozen line).
#
name: Docs Release

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'docs/**'
      - '.github/workflows/docs-release.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (defaults to the ref the workflow runs from)'
        required: false
        default: ''
        type: string
      tag:
        description: 'Image tag override (default: docs for main, docs-vX.Y otherwise)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted]
    outputs:
      ref: ${{ steps.line.outputs.ref }}
      image_tag: ${{ steps.line.outputs.image_tag }}
      app_version: ${{ steps.line.outputs.app_version }}
      docs_url: ${{ steps.line.outputs.docs_url }}
      algolia_index: ${{ steps.line.outputs.algolia_index }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.ref }}
        sparse-checkout: testplanit/package.json
        sparse-checkout-cone-mode: false

    - name: Resolve release line
      id: line
      env:
        INPUT_REF: ${{ inputs.ref }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        REF="${INPUT_REF:-$GITHUB_REF_NAME}"
        APP_VERSION="$(sed -nE 's/^[[:space:]]*"version":[[:space:]]*"([^"]+)".*/\1/p' testplanit/package.json | head -1)"
        LINE="$(echo "$APP_VERSION" | sed -nE 's/^([0-9]+\.[0-9]+)\..*/\1/p')"
        if [ -z "$APP_VERSION" ] || [ -z "$LINE" ]; then
          echo "Could not read a semver version from testplanit/package.json (got '$APP_VERSION')" >&2
          exit 1
        fi
        if [ "$REF" = "main" ]; then
          IMAGE_TAG="docs"
          DOCS_URL="https://docs.testplanit.com"
          ALGOLIA_INDEX="testplanit"
        else
          IMAGE_TAG="docs-v${LINE}"
          DOCS_URL="https://docs-v${LINE//./-}.testplanit.com"
          ALGOLIA_INDEX="testplanit-v${LINE}"
        fi
        IMAGE_TAG="${INPUT_TAG:-$IMAGE_TAG}"
        {
          echo "ref=$REF"
          echo "image_tag=$IMAGE_TAG"
          echo "app_version=$APP_VERSION"
          echo "docs_url=$DOCS_URL"
          echo "algolia_index=$ALGOLIA_INDEX"
        } >> "$GITHUB_OUTPUT"
        echo "Building docs for $APP_VERSION (line $LINE) from $REF -> $IMAGE_TAG at $DOCS_URL"

  build-amd64:
    needs: resolve
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve.outputs.ref }}

    - name: Set lowercase repo name
      run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push AMD64 docs image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docs/Dockerfile
        platforms: linux/amd64
        push: true
        build-args: |
          DOCS_APP_VERSION=${{ needs.resolve.outputs.app_version }}
          DOCS_URL=${{ needs.resolve.outputs.docs_url }}
          DOCS_ALGOLIA_INDEX=${{ needs.resolve.outputs.algolia_index }}
        tags: ghcr.io/${{ env.REPO_LC }}:${{ needs.resolve.outputs.image_tag }}-amd64

  build-arm64:
    needs: resolve
    runs-on: [self-hosted, macOS, arm64]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve.outputs.ref }}

    - name: Set lowercase repo name
      run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Start Colima
      run: |
        if ! colima status 2>/dev/null; then
          colima start --cpu 6 --memory 24
        fi
        docker context use colima

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ARM64 docs image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docs/Dockerfile
        platforms: linux/arm64
        push: true
        build-args: |
          DOCS_APP_VERSION=${{ needs.resolve.outputs.app_version }}
          DOCS_URL=${{ needs.resolve.outputs.docs_url }}
          DOCS_ALGOLIA_INDEX=${{ needs.resolve.outputs.algolia_index }}
        tags: ghcr.io/${{ env.REPO_LC }}:${{ needs.resolve.outputs.image_tag }}-arm64

  merge-manifests:
    needs: [resolve, build-amd64, build-arm64]
    runs-on: [self-hosted]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Set lowercase repo name
      run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest
      run: |
        TAG="${{ needs.resolve.outputs.image_tag }}"

        docker buildx imagetools create -t ghcr.io/${REPO_LC}:${TAG} \
          ghcr.io/${REPO_LC}:${TAG}-amd64 \
          ghcr.io/${REPO_LC}:${TAG}-arm64
