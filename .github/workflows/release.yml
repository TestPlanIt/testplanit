# Release Workflow
#
# Builds and publishes Docker images when a tag is pushed (or via manual
# dispatch). GitHub Releases are created by semantic-release, which also
# triggers this workflow.
#
# ARM64 ONLY: production deploys (*.testplanit.com) run exclusively on arm64,
# so we build only linux/arm64 — building amd64 was wasted CPU. (No multi-arch
# manifest merge is needed for a single architecture.)
#
# Images published:
# - ghcr.io/testplanit/testplanit:<version>          (Next.js server)
# - ghcr.io/testplanit/testplanit:<version>-workers  (background workers)
# - ghcr.io/testplanit/testplanit:workers-sha-<sha>  (sha-pinned workers; the k8s
#   Deployment SHOULD reference this so `kubectl rollout undo` has real history.
#   See the multitenant-workers Deployment manifest in the private-ops repo.)
# - :latest / :latest-workers are moved only when the tag is the newest semver.
#
# Build arg BASE_DOMAIN=testplanit.com enables the *.testplanit.com wildcard for
# Next.js image optimization, so a SINGLE image serves all customer subdomains
# (company1.testplanit.com, company2.testplanit.com, ...) without per-customer rebuilds.
#
# Manual trigger: Actions tab -> Release -> Run workflow -> enter the tag (e.g. v1.0.0).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # Build + publish ARM64 images natively on a macOS arm64 runner (Colima).
  build-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, macOS, arm64]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # full history/tags for the 'latest' comparison

    - name: Set lowercase repo name
      run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Start Colima
      run: |
        if ! colima status 2>/dev/null; then
          colima start --cpu 6 --memory 24
        fi
        docker context use colima

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate version info for Docker build
      run: |
        cd testplanit
        node scripts/generate-version.js
        mkdir -p public
        cp public/version.json .docker-version.json || echo "Version file not generated"

    - name: Build and push ARM64 images
      working-directory: ./testplanit
      run: |
        VERSION="${{ github.ref_name }}"
        VERSION_NUM="${VERSION#v}"
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

        docker buildx bake -f docker-bake.hcl --allow=fs.read=.. --push \
          --set "*.platform=linux/arm64" \
          --set "production.tags=ghcr.io/${REPO_LC}:${VERSION_NUM}" \
          --set "production.tags=ghcr.io/${REPO_LC}:${VERSION}" \
          --set "workers.tags=ghcr.io/${REPO_LC}:${VERSION_NUM}-workers" \
          --set "workers.tags=ghcr.io/${REPO_LC}:${VERSION}-workers" \
          --set "workers.tags=ghcr.io/${REPO_LC}:workers-sha-${SHORT_SHA}" \
          --set "*.args.VERSION=${VERSION}" \
          --set "*.args.GIT_COMMIT=${{ github.sha }}" \
          --set "*.args.BASE_DOMAIN=testplanit.com"

    - name: Smoke-test workers image
      run: |
        VERSION="${{ github.ref_name }}"
        VERSION_NUM="${VERSION#v}"
        IMAGE="ghcr.io/${REPO_LC}:${VERSION_NUM}-workers"
        docker pull "$IMAGE"
        # Fail fast if any worker entrypoint's require graph is broken
        # (e.g. a missing native dep or a stripped package — the failure
        # mode from the 2026-04-22 next/headers incident).
        docker run --rm --entrypoint node "$IMAGE" ./scripts/smoke-test-workers.js

    - name: Update 'latest' if this is the newest release
      run: |
        VERSION="${{ github.ref_name }}"
        # Only move 'latest' when this tag is the newest 3-part semver (vX.Y.Z),
        # ignoring prerelease / non-semver tags (e.g. v1.0.0-beta.0, v1.1).
        LATEST_TAG=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
        echo "Current version: $VERSION, Latest semver tag: $LATEST_TAG"
        if [ "$VERSION" = "$LATEST_TAG" ]; then
          echo "Updating 'latest' tags to $VERSION"
          docker buildx imagetools create -t ghcr.io/${REPO_LC}:latest ghcr.io/${REPO_LC}:${VERSION}
          docker buildx imagetools create -t ghcr.io/${REPO_LC}:latest-workers ghcr.io/${REPO_LC}:${VERSION}-workers
        else
          echo "Skipping 'latest' update - $VERSION is not the latest release (latest: $LATEST_TAG)"
        fi

  # Manual build: ARM64 images for an existing tag (workflow_dispatch).
  docker-manual-arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, arm64]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.tag }}
        fetch-depth: 0

    - name: Set lowercase repo name
      run: echo "REPO_LC=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Start Colima
      run: |
        if ! colima status 2>/dev/null; then
          colima start --cpu 6 --memory 24
        fi
        docker context use colima

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate version info for Docker build
      run: |
        cd testplanit
        node scripts/generate-version.js
        mkdir -p public
        cp public/version.json .docker-version.json || echo "Version file not generated"

    - name: Build and push ARM64 images
      working-directory: ./testplanit
      run: |
        VERSION="${{ github.event.inputs.tag }}"
        VERSION_NUM="${VERSION#v}"
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
        docker buildx bake -f docker-bake.hcl --allow=fs.read=.. --push \
          --set "*.platform=linux/arm64" \
          --set "production.tags=ghcr.io/${REPO_LC}:${VERSION_NUM}" \
          --set "production.tags=ghcr.io/${REPO_LC}:${VERSION}" \
          --set "workers.tags=ghcr.io/${REPO_LC}:${VERSION_NUM}-workers" \
          --set "workers.tags=ghcr.io/${REPO_LC}:${VERSION}-workers" \
          --set "workers.tags=ghcr.io/${REPO_LC}:workers-sha-${SHORT_SHA}" \
          --set "*.args.VERSION=${VERSION}" \
          --set "*.args.GIT_COMMIT=${{ github.sha }}" \
          --set "*.args.BASE_DOMAIN=testplanit.com"

    - name: Smoke-test workers image
      run: |
        VERSION="${{ github.event.inputs.tag }}"
        VERSION_NUM="${VERSION#v}"
        IMAGE="ghcr.io/${REPO_LC}:${VERSION_NUM}-workers"
        docker pull "$IMAGE"
        docker run --rm --entrypoint node "$IMAGE" ./scripts/smoke-test-workers.js

    - name: Update 'latest' if this is the newest release
      run: |
        VERSION="${{ github.event.inputs.tag }}"
        LATEST_TAG=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
        echo "Current version: $VERSION, Latest semver tag: $LATEST_TAG"
        if [ "$VERSION" = "$LATEST_TAG" ]; then
          echo "Updating 'latest' tags to $VERSION"
          docker buildx imagetools create -t ghcr.io/${REPO_LC}:latest ghcr.io/${REPO_LC}:${VERSION}
          docker buildx imagetools create -t ghcr.io/${REPO_LC}:latest-workers ghcr.io/${REPO_LC}:${VERSION}-workers
        else
          echo "Skipping 'latest' update - $VERSION is not the latest release (latest: $LATEST_TAG)"
        fi
