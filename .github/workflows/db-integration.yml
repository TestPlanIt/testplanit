# Live-DB integration gate.
#
# The __tests__/integration suite proves the ACL policy layer (AuthCtx /
# accessibleProjectIds, project write parity, restrictive read rules, dataset
# atomicity) against real SQL. Those files gate themselves on
# RUN_DB_INTEGRATION=1, so the regular unit-test job silently skips them —
# this workflow is the only place they actually run in CI.

name: DB Integration Tests

on:
  workflow_dispatch:
  push:
    # release/* included deliberately. Every suite this job newly exercises was
    # written on a release branch, and because the job only watched main and
    # beta it had never once run against them — six suites had been failing
    # since the day they landed, invisible until an unrelated PR happened to
    # touch a matching path.
    branches: [main, beta, "release/**"]
    paths:
      - "testplanit/__tests__/integration/**"
      - "testplanit/lib/**"
      - "testplanit/schema.zmodel"
      - "testplanit/db/**"
      - ".github/workflows/db-integration.yml"
  pull_request:
    paths:
      - "testplanit/__tests__/integration/**"
      - "testplanit/lib/**"
      - "testplanit/schema.zmodel"
      - "testplanit/db/**"
      - ".github/workflows/db-integration.yml"

defaults:
  run:
    working-directory: testplanit

jobs:
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tpi_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: "postgresql://user:password@localhost:5433/tpi_test?schema=public"
      NEXTAUTH_URL: "http://localhost:3002"
      NEXTAUTH_SECRET: "ci-integration-secret-not-for-production"
      ENCRYPTION_KEY: "ci-integration-encryption-32chars"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_NAME: "Administrator Account"
      ADMIN_PASSWORD: "admin"
      NODE_OPTIONS: "--max-old-space-size=8192"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ZenStack/Prisma client
        run: pnpm generate

      - name: Apply migrations
        # `migrate deploy`, not `db push`. This suite asserts against database
        # objects that exist ONLY in migrations/, and that a push cannot build
        # because they are not expressible in schema.zmodel: the ICU collations
        # the requirements-tree sort tests compare the server's ORDER BY
        # against, the DataChangeLog partial poll index, the
        # effective-case-status view. A pushed database looks right and sorts
        # wrong — on the musl-based postgres:15-alpine image above, an
        # un-collated text column sorts in byte order (every capital before
        # every lowercase), which is exactly what the collation migration
        # exists to fix.
        #
        # The two cannot be combined: schema.zmodel declares dcl_unprocessed_seq
        # as a plain index where the migration creates it partial, so a push
        # after a deploy fails with `relation "dcl_unprocessed_seq" already
        # exists`. Deploying alone is also what production does, so this job now
        # exercises the schema the app actually ships on.
        run: pnpm exec zenstack migrate deploy --schema schema.zmodel

      - name: Apply database triggers
        # A large share of the behaviour under test is enforced by Postgres
        # triggers rather than by the ORM — the issue-hierarchy cycle guard,
        # the seeded-status guard, deletedAt stamping, the single-default
        # guards — and nothing else in this job creates them, so those suites
        # were asserting against a database that could not enforce what they
        # were checking.
        #
        # Order is load-bearing: this must follow the migrations. The collation
        # migration ALTERs column types, and Postgres refuses that once a
        # trigger references the column ("cannot alter type of a column used in
        # a trigger definition").
        run: pnpm triggers:apply

      - name: Seed baseline data (roles, workflows, admin)
        run: pnpm exec tsx db/seed.ts

      - name: Run live-DB integration tests
        run: RUN_DB_INTEGRATION=1 pnpm exec vitest run __tests__/integration
