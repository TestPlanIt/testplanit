services:
  prod:
    container_name: testplanit-prod
    # Prebuilt, domain-agnostic self-host image: `docker compose pull` fetches
    # it. `up --build` builds the same image from source instead, which is only
    # needed for local code changes or SELF_HOSTED=false. TESTPLANIT_VERSION
    # pins a release (e.g. 1.1.12); set it in the shell, default .env, or
    # --env-file, not the .env.production env_file.
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}
    build:
      context: ..
      dockerfile: testplanit/Dockerfile
      target: production
      args:
        # Baked into next.config's image remotePatterns at build time so the
        # Next.js image optimizer accepts <subdomain>.${BASE_DOMAIN} MinIO URLs.
        # Only consulted when SELF_HOSTED is false (optimizer on).
        BASE_DOMAIN: ${BASE_DOMAIN:-example.com}
        # Self-hosted default: turn OFF Next's image optimizer at BUILD time, so
        # <Image> renders a plain <img> pointing straight at your storage — no
        # remotePatterns allowlist to satisfy, so one build works on any domain.
        # This MUST be a build arg: next.config bakes images.unoptimized into the
        # standalone build (.next/required-server-files.json), and the running
        # server reads that frozen config — a runtime/env_file var is too late and
        # silently has no effect (broken images with 400s from /_next/image).
        # Set SELF_HOSTED=false to run the optimizer instead; then BASE_DOMAIN
        # above must be your real domain. Substitution reads the build environment
        # (shell / default .env / --env-file), NOT the .env.production env_file.
        SELF_HOSTED: ${SELF_HOSTED:-true}
        # Per-file upload ceiling in MB (attachments and inline document
        # images). Baked into next.config's serverActions.bodySizeLimit as the
        # image default; the entrypoint re-syncs it from the `environment:` value
        # below on every start, so changing it needs a restart, not a rebuild.
        # Raise the bundled nginx to match via nginx-local/ -- see
        # nginx-local/README.md.
        # Substitution reads the build environment (shell / default .env /
        # --env-file), NOT the .env.production env_file.
        UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
    env_file:
      - .env.production
    environment:
      # Per-service pool size (overrides any DATABASE_POOL_MAX in the shared
      # .env.production env_file). See lib/db/poolConfig.ts.
      #
      # Budget against postgres max_connections=300 (297 usable after the 3
      # superuser-reserved): prod 100 + workers 60 = 160 peak, leaving ~137 for
      # psql sessions, `migrate deploy`, and one-off containers. Raising either
      # value past that budget trades an app-side queue for postgres refusing
      # connections outright (FATAL 53300), which is strictly worse.
      #
      # Note the host has 4 vCPUs, so concurrency beyond ~4x that mostly queues
      # inside postgres rather than adding throughput. The pool is sized for
      # burst absorption, not parallelism: it exists so a handful of slow
      # queries can't occupy every slot and stall unrelated routes.
      DATABASE_POOL_MAX: ${PROD_DATABASE_POOL_MAX:-100}
      # Same value as the build arg above -- uploadFile.ts reads it at runtime,
      # and the entrypoint re-syncs Next's frozen body limit from it at boot.
      # Both resolve from one UPLOAD_MAX_MB in .env, so they cannot drift.
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
    ports:
      - "${DOCKER_PROD_APP_PORT:-30000}:3000"
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.10
    restart: unless-stopped
    # Waits for the bundled file storage to be ready (and migrated) when the
    # with-minio profile is enabled; ignored when using external S3.
    depends_on:
      minio-init:
        condition: service_completed_successfully
        required: false

  workers:
    container_name: testplanit-workers
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}-workers
    build:
      context: ..
      dockerfile: testplanit/Dockerfile
      target: workers
    env_file:
      - .env.production
    environment:
      # Worker-side pool. Smaller than prod's because the fleet's summed BullMQ
      # concurrency (~30 across sync/audit/email/copy-move/... queues) is the
      # real upper bound on simultaneous queries here; 60 leaves room for the
      # bursty ones without eating into prod's share of the 297-connection
      # budget. See the note on the prod service above.
      DATABASE_POOL_MAX: ${WORKERS_DATABASE_POOL_MAX:-60}
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.11
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Recommended ceiling for the worker fleet (see the resource-allocation
          # table in docs: Installation > Docker Setup). Raise via
          # WORKERS_MEMORY_LIMIT for very large Testmo imports or busy multi-tenant
          # clusters, host RAM permitting (see docs: Background Processes > Worker
          # memory tiers). Set in the build/deploy environment (shell / default
          # .env / --env-file), not the .env.production env_file.
          memory: ${WORKERS_MEMORY_LIMIT:-4G}
    depends_on:
      prod:
        condition: service_started

  db-init-prod:
    container_name: testplanit-db-init
    # Runs on the server image. Its entrypoint applies migrations, audit
    # triggers, and Postgres extensions, then this command seeds the database
    # (idempotent). If Postgres is fronted by a transaction-mode pooler
    # (pgbouncer), set DIRECT_DATABASE_URL — `zenstack migrate deploy` needs a
    # real (non-pooled) session. Existing pre-migration databases must be
    # baselined once (testplanit/migrations/README.md).
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}
    env_file:
      - .env.production
    command: ["tsx", "db/seed.ts"]
    networks:
      - testplanit-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - with-postgres

  # Prepares the bundled file storage: creates the bucket with its public-read
  # and CORS rules, and stops startup while files in ./docker-data/minio have
  # not been migrated (see scripts/storage-init.sh).
  minio-init:
    image: amazon/aws-cli:2.37.4
    env_file:
      - .env.production
    entrypoint: ["sh", "/storage-init.sh"]
    volumes:
      - ./scripts/storage-init.sh:/storage-init.sh:ro
      - ./docker-data:/docker-data:ro
    networks:
      - testplanit-net
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - with-minio

  postgres:
    container_name: testplanit-postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testplanit_prod
      # ICU as the default collation provider: the alpine image's musl libc
      # cannot collate locales, so without this every ORDER BY on text sorts in
      # byte order (all capitals before all lowercase). Only applies when the
      # data volume is first initialized; existing databases are covered by the
      # app's migrations, which re-collate the sorted display-name columns.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
      # Postgres 18 defaults PGDATA to a version-specific subdirectory
      # (/var/lib/postgresql/18/docker) and expects the volume mounted at
      # /var/lib/postgresql instead of .../data. Pin the old flat layout so the
      # mount path below doesn't have to change across major-version bumps, and
      # to avoid a still-open docker-library/postgres detection bug around the
      # new layout (github.com/docker-library/postgres/issues/1400).
      PGDATA: /var/lib/postgresql/data
    # Cap Postgres CPU usage so the app, workers, nginx, and valkey keep their
    # share of the host; tune POSTGRES_CPU_LIMIT to your host's core count. Set in
    # the deploy environment (shell / default .env / --env-file), not the
    # .env.production env_file.
    cpus: "${POSTGRES_CPU_LIMIT:-2}"
    # Parallel query workers allocate their shared memory segments in
    # /dev/shm, which Docker sizes at 64MB by default. The parallelism caps
    # below keep that demand modest, but a report over a large result table
    # can still exhaust 64MB and fail with "could not resize shared memory
    # segment ... No space left on device" — seen by the user as a 500 from
    # the reports API. This is a cap, not a reservation: pages are consumed
    # only as queries use them. Raise POSTGRES_SHM_SIZE (e.g. 1gb) on large
    # installs that report heavily.
    shm_size: "${POSTGRES_SHM_SIZE:-256mb}"
    command: >
      postgres
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c max_worker_processes=4
    # Named volume, not a bind mount: Postgres's data directory must never live
    # inside the build context (context: .. at the repo root). Once Postgres has
    # run, it chmods the directory 0700, which makes BuildKit's context walker
    # fail with "permission denied" on any subsequent `docker compose build`.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DOCKER_POSTGRES_PORT:-5432}:5432"
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.30
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testplanit_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres

  valkey:
    container_name: testplanit-valkey
    image: valkey/valkey:8-alpine
    ports:
      - "${DOCKER_VALKEY_PORT:-6379}:6379"
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.40
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker-data/valkey:/data
    profiles:
      - with-valkey

  # Init service to create elasticsearch directory with proper permissions
  elasticsearch-init:
    image: alpine:latest
    user: root
    command: >
      sh -c "
        mkdir -p /data &&
        chown -R 1000:1000 /data &&
        chmod -R 755 /data
      "
    volumes:
      - ./docker-data/elasticsearch:/data
    profiles:
      - with-elasticsearch

  elasticsearch:
    container_name: testplanit-elasticsearch
    image: elasticsearch:9.0.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${DOCKER_ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${DOCKER_ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.50
    restart: unless-stopped
    volumes:
      - ./docker-data/elasticsearch:/usr/share/elasticsearch/data
    user: "1000:1000"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - with-elasticsearch

  # Prepares ./docker-data/rustfs for RustFS, which runs as uid 10001.
  minio-perms:
    image: alpine:latest
    user: root
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data"
    volumes:
      - ./docker-data/rustfs:/data
    profiles:
      - with-minio

  # S3-compatible file storage (RustFS). The service keeps the name `minio` so
  # existing AWS_ENDPOINT_URL=http://minio:9000 settings and the with-minio
  # profile keep working. Files from the old MinIO storage in
  # ./docker-data/minio are migrated with scripts/migrate-minio-to-rustfs.sh.
  minio:
    container_name: testplanit-minio
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin123
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${DOCKER_MINIO_API_PORT:-9000}:9000" # S3 API (for external access)
      - "${DOCKER_MINIO_CONSOLE_PORT:-9001}:9001" # Storage console (direct access for admin)
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.20
    restart: unless-stopped
    volumes:
      - ./docker-data/rustfs:/data
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles:
      - with-minio

  # Nginx reverse proxy for internal routing
  nginx:
    container_name: testplanit-nginx
    image: nginx:alpine
    # Cap the container log. nginx is by far the loudest container here
    # (the access log carries rt/urt/ua per request), and json-file defaults to
    # unbounded -- it reached 3.0GB in 9 days. 100m x 10 keeps ~3 days of
    # request timing for perf debugging while capping the container at 1GB.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    ports:
      - "${DOCKER_NGINX_HTTP_PORT:-80}:80" # HTTP port (your external reverse proxy should point here)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./maintenance.html:/etc/nginx/maintenance.html:ro
      # Per-deployment overrides (custom error pages, etc.). Tracked dir holds
      # only a README + *.example; real *.conf and pages are gitignored/local.
      - ./nginx-local:/etc/nginx/local:ro
    networks:
      testplanit-net:
        ipv4_address: 172.19.0.60
    restart: unless-stopped
    depends_on:
      prod:
        condition: service_started
    healthcheck:
      # Use 127.0.0.1, not localhost: nginx.conf binds IPv4 only (`listen 80;`),
      # but `localhost` resolves to IPv6 ::1 first, so wget gets connection
      # refused and the container falsely reports unhealthy.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - with-minio

networks:
  testplanit-net:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so service IPs below stay stable across restarts.
        - subnet: 172.19.0.0/16

volumes:
  postgres-data:
    name: testplanit-postgres-data
