project_id: "778038"
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "./messages"

# Files to be translated
files:
  - source: /en-US.json
    translation: /%locale%.json
    languages_mapping:
      locale:
        # Map Crowdin locale codes to our locale format
        ar: "ar-SA"
        cs: "cs-CZ"
        de: "de-DE"
        es-ES: "es-ES"
        fr: "fr-FR"
        it: "it-IT"
        nl: "nl-NL"
        pl: "pl-PL"
        pt-BR: "pt-BR"
        ru: "ru-RU"
        tr: "tr-TR"
        vi: "vi-VN"
        zh-CN: "zh-CN"
        zh-TW: "zh-TW"
        ja: "ja-JP"
        ko: "ko-KR"
