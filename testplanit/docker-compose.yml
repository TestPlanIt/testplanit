services:
  dev:
    container_name: testplanit-dev
    build:
      context: .. # repo root: single root pnpm-lock.yaml + pnpm-workspace.yaml
      target: development # Use the 'development' stage from Dockerfile
      dockerfile: testplanit/Dockerfile
    env_file:
      - .env.development # Load development environment variables
    environment:
      VALKEY_URL: "valkey://valkey:6379" # Valkey connection URL
    volumes:
      - .:/app/testplanit # Mount source code for hot-reloading
      - /app/testplanit/node_modules # Prevent host node_modules from overwriting container's
      - /app/testplanit/.next # Prevent host .next from overwriting container's
    ports:
      - "${DOCKER_DEV_APP_PORT:-3000}:3000"
    # Use wait script, then execute next dev directly from node_modules
    entrypoint:
      [
        "/usr/local/bin/wait-for-postgres.sh",
        "postgres",
        "5432",
        "./node_modules/.bin/next",
        "dev",
      ]
    networks:
      - testplanit-net
    depends_on:
      # Wait for the db-init service to complete successfully
      db-init:
        condition: service_completed_successfully
      # Also depends on postgres itself (though implicitly covered by db-init)
      postgres:
        condition: service_healthy
      # Add dependency on Valkey
      valkey:
        condition: service_healthy
    profiles:
      - dev

  workers-dev:
    container_name: testplanit-workers-dev
    build:
      context: ..
      target: workers
      dockerfile: testplanit/Dockerfile
    env_file:
      - .env.development
    environment:
      VALKEY_URL: "valkey://valkey:6379"
      NODE_ENV: development
    networks:
      - testplanit-net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    profiles:
      - dev

  prod:
    container_name: testplanit-prod
    # Prebuilt self-host image (`docker compose pull`); `up --build` builds it
    # from source instead. TESTPLANIT_VERSION pins a release (e.g. 1.1.12).
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}
    build:
      context: .. # repo root: single root pnpm-lock.yaml + pnpm-workspace.yaml
      target: production # Use the 'production' stage from Dockerfile (default)
      dockerfile: testplanit/Dockerfile
    env_file:
      - .env.production # Load production environment variables
    environment:
      VALKEY_URL: "valkey://valkey:6379" # Valkey connection URL
    ports:
      - "${DOCKER_PROD_APP_PORT:-30000}:3000" # Map host port to container port 3000
    networks:
      - testplanit-net
    depends_on:
      # Wait for the prod db-init service to complete successfully
      db-init-prod:
        condition: service_completed_successfully
      # Wait for MinIO initialization to complete
      minio-init:
        condition: service_completed_successfully
      # Also depends on postgres itself (though implicitly covered)
      postgres:
        condition: service_healthy
      # Add dependency on Valkey
      valkey:
        condition: service_healthy
      # Add dependency on Elasticsearch
      elasticsearch:
        condition: service_healthy
      # Add dependency on MinIO
      minio:
        condition: service_healthy
    profiles:
      - prod

  workers:
    container_name: testplanit-workers
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}-workers
    build:
      context: ..
      target: workers
      dockerfile: testplanit/Dockerfile
    env_file:
      - .env.production
    environment:
      VALKEY_URL: "valkey://valkey:6379"
    networks:
      - testplanit-net
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init-prod:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    profiles:
      - prod

  db-init:
    # Use the same build context and target as the dev service
    build:
      context: .. # repo root: single root pnpm-lock.yaml + pnpm-workspace.yaml
      target: development # Uses the same base image with deps installed
      dockerfile: testplanit/Dockerfile
    env_file:
      - .env.development # Needs DB_URL and other env vars for prisma/zenstack
    working_dir: /app/testplanit # Set working directory for commands within the container
    # Push schema and seed database (no migrations)
    command:
      [
        "sh",
        "-c",
        "echo 'Waiting for DB...' && /usr/local/bin/wait-for-postgres.sh postgres 5432 -- echo 'DB ready, applying migrations...' && npx zenstack migrate deploy --schema schema.zmodel --no-version-check && echo 'Migrations applied, seeding...' && pnpm tsx db/seed.ts && echo 'DB initialized and seeded.'",
      ]
    networks:
      - testplanit-net
    depends_on:
      postgres:
        condition: service_healthy # Wait for postgres healthcheck
    profiles:
      - dev

  db-init-prod:
    # Runs on the server image. Its entrypoint applies migrations, audit
    # triggers, and Postgres extensions, then this command seeds the database
    # (idempotent). Existing pre-migration databases need a one-time baseline —
    # see testplanit/migrations/README.md.
    image: ghcr.io/testplanit/testplanit-selfhost:${TESTPLANIT_VERSION:-latest}
    env_file:
      - .env.production # Use PRODUCTION env vars
    command: ["tsx", "db/seed.ts"]
    networks:
      - testplanit-net
    depends_on:
      postgres:
        condition: service_healthy # Wait for postgres healthcheck
    profiles:
      - prod

  # Prepares the bundled file storage: creates the bucket with its public-read
  # and CORS rules, and stops startup while files in ./docker-data/minio have
  # not been migrated (see scripts/storage-init.sh).
  minio-init:
    image: amazon/aws-cli:2.37.4
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_REGION: us-east-1
      AWS_BUCKET_NAME: testplanit
      STORAGE_MIGRATION_SKIP: ${STORAGE_MIGRATION_SKIP:-}
    entrypoint: ["sh", "/storage-init.sh"]
    volumes:
      - ./scripts/storage-init.sh:/storage-init.sh:ro
      - ./docker-data:/docker-data:ro
    networks:
      - testplanit-net
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - prod

  postgres:
    container_name: testplanit-postgres
    image: postgres:18-alpine # Use a specific Postgres version
    # Docker gives a container 64MB of /dev/shm, which is where Postgres puts
    # the shared memory segments its parallel query workers need. Report
    # queries over large result tables pick parallel plans and exhaust it,
    # failing with "could not resize shared memory segment ... No space left
    # on device" — which surfaces as a 500 from the reports API, not as a
    # database error anyone would think to look for.
    shm_size: 256mb
    environment:
      POSTGRES_USER: user # Must match the user in DATABASE_URL
      POSTGRES_PASSWORD: password # Must match the password in DATABASE_URL
      POSTGRES_DB: testplanit_dev # Creates this DB initially. Prod app uses testplanit_prod
      # Postgres 18 defaults PGDATA to a version-specific subdirectory
      # (/var/lib/postgresql/18/docker) and expects the volume mounted at
      # /var/lib/postgresql instead of .../data. Pin the old flat layout so the
      # mount path below doesn't have to change across major-version bumps, and
      # to avoid a still-open docker-library/postgres detection bug around the
      # new layout (github.com/docker-library/postgres/issues/1400).
      PGDATA: /var/lib/postgresql/data
    # Named volume, not a bind mount: Postgres's data directory must never live
    # inside the build context (context: .. at the repo root). Once Postgres has
    # run, it chmods the directory 0700, which makes BuildKit's context walker
    # fail with "permission denied" on any subsequent `docker compose build`.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DOCKER_POSTGRES_PORT:-5432}:5432" # Expose Postgres on configurable host port
    networks:
      - testplanit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testplanit_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    container_name: testplanit-valkey
    image: valkey/valkey:8-alpine
    ports:
      - "${DOCKER_VALKEY_PORT:-6379}:6379"
    networks:
      - testplanit-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker-data/valkey:/data

  # Init service to create elasticsearch directory with proper permissions
  elasticsearch-init:
    image: alpine:latest
    user: root
    command: >
      sh -c "
        mkdir -p /data &&
        chown -R 1000:1000 /data &&
        chmod -R 755 /data
      "
    volumes:
      - ./docker-data/elasticsearch:/data
    profiles:
      - prod

  elasticsearch:
    container_name: testplanit-elasticsearch
    image: elasticsearch:9.0.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${DOCKER_ELASTICSEARCH_HTTP_PORT:-9200}:9200"
      - "${DOCKER_ELASTICSEARCH_TRANSPORT_PORT:-9300}:9300"
    networks:
      - testplanit-net
    volumes:
      - ./docker-data/elasticsearch:/usr/share/elasticsearch/data
    user: "1000:1000"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - prod

  # Prepares ./docker-data/rustfs for RustFS, which runs as uid 10001.
  minio-perms:
    image: alpine:latest
    user: root
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data"
    volumes:
      - ./docker-data/rustfs:/data
    profiles:
      - prod

  # S3-compatible file storage (RustFS). The service keeps the name `minio` so
  # the minio:9000 endpoint keeps working. Files from the old MinIO storage in
  # ./docker-data/minio are migrated with scripts/migrate-minio-to-rustfs.sh.
  minio:
    container_name: testplanit-minio
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin123
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${DOCKER_MINIO_API_PORT:-9000}:9000" # S3 API (for external access)
      - "${DOCKER_MINIO_CONSOLE_PORT:-9001}:9001" # Storage console (direct access for admin)
    networks:
      - testplanit-net
    volumes:
      - ./docker-data/rustfs:/data
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    profiles:
      - prod

  # Nginx reverse proxy for internal routing
  nginx:
    container_name: testplanit-nginx
    image: nginx:alpine
    ports:
      - "${DOCKER_NGINX_HTTP_PORT:-80}:80" # HTTP port (your external reverse proxy should point here)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - testplanit-net
    depends_on:
      prod:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - prod

networks:
  testplanit-net:
    driver: bridge

volumes:
  postgres-data:
    name: testplanit-postgres-data
