# Backing services for the E2E suite. Ports match .env.e2e.example and the CI
# E2E job, and differ from docker-compose.dev.yml so both stacks can run side
# by side. Nothing is persisted: e2e/setup-db.ts resets and seeds every run.
#
#   docker compose -f docker-compose.e2e.yml up -d
#   cp .env.e2e.example .env.e2e
#   pnpm build && E2E_PROD=on pnpm test:e2e

name: testplanit-e2e

services:
  postgres:
    image: postgres:15-alpine
    # Matches the dev and prod compose files: Docker's 64MB /dev/shm is too
    # small for Postgres parallel query workers once a suite has built up
    # result data, and the failure looks like a flaky test rather than a
    # resource limit.
    shm_size: 256mb
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tpi_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tpi_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:9.0.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9221:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 12

  # S3-compatible storage. e2e/setup-db.ts creates the bucket and its
  # public-read and CORS rules.
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: e2e-access-key
      RUSTFS_SECRET_KEY: e2e-secret-key
    ports:
      - "9100:9000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
