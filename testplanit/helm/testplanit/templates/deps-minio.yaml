{{- if .Values.objectStorage.minio.enabled }}
{{- $name := include "testplanit.minio.fullname" . }}
{{- $mc := .Values.objectStorage.minio }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 8 }}
    spec:
      {{- with $mc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: minio
          image: {{ $mc.image }}
          imagePullPolicy: {{ $mc.imagePullPolicy }}
          args: ["server", "/data", "--console-address", ":9001", "--address", ":9000"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $mc.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not $mc.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if $mc.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml $mc.persistence.accessModes | nindent 10 }}
        {{- with $mc.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $mc.persistence.size | quote }}
  {{- end }}
---
# One-shot job: wait for MinIO, create the bucket, allow public downloads so
# the browser can fetch attachments via the ingress path.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Waiting for MinIO..."
              until mc alias set tp "http://{{ $name }}:9000" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 3
              done
              mc mb --ignore-existing "tp/{{ $mc.bucket }}"
              mc anonymous set download "tp/{{ $mc.bucket }}" || true
              echo "MinIO bucket ready: {{ $mc.bucket }}"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
{{- end }}
