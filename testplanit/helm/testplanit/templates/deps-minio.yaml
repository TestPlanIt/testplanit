{{- if .Values.objectStorage.minio.enabled }}
{{- $name := include "testplanit.minio.fullname" . }}
{{- $mc := .Values.objectStorage.minio }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  selector:
    {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio") | nindent 8 }}
    spec:
      {{- with $mc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $mc.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        # S3-compatible storage (RustFS). It keeps the "minio" names and secret
        # keys so existing values, Services and ingress paths keep working, and
        # serves the existing MinIO data on the same volume.
        - name: minio
          image: {{ $mc.image }}
          imagePullPolicy: {{ $mc.imagePullPolicy }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml $mc.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        # The image's /logs is not writable by the pod's non-root user.
        - name: logs
          emptyDir: {}
      {{- if not $mc.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if $mc.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml $mc.persistence.accessModes | nindent 10 }}
        {{- with $mc.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $mc.persistence.size | quote }}
  {{- end }}
---
# One-shot job: wait for the storage, create the bucket, allow public
# downloads so the browser can fetch attachments via the ingress path, and
# allow cross-origin presigned uploads.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "minio-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ $mc.initImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              s3api() { aws --endpoint-url "http://{{ $name }}:9000" s3api "$@"; }
              echo "Waiting for storage..."
              until s3api list-buckets >/dev/null 2>&1; do
                sleep 3
              done
              s3api head-bucket --bucket "{{ $mc.bucket }}" >/dev/null 2>&1 ||
                s3api create-bucket --bucket "{{ $mc.bucket }}" >/dev/null
              s3api put-bucket-policy --bucket "{{ $mc.bucket }}" --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::{{ $mc.bucket }}/*"]}]}'
              s3api put-bucket-cors --bucket "{{ $mc.bucket }}" --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"]}]}'
              echo "Storage bucket ready: {{ $mc.bucket }}"
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "testplanit.secretName" . }}
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
