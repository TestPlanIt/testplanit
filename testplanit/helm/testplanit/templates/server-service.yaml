apiVersion: v1
kind: Service
metadata:
  name: {{ include "testplanit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with (merge (dict) .Values.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "testplanit.componentSelectorLabels" (dict "root" $ "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
