{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled=true" .Values.ingress.host }}
{{- $svc := include "testplanit.fullname" . }}
{{- $minioEnabled := .Values.objectStorage.minio.enabled }}
{{- $minioPath := .Values.ingress.minioPath }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "testplanit.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with (merge (dict) .Values.ingress.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled=true" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if and $minioEnabled $minioPath }}
          # Browser access to attachments stored in bundled MinIO.
          - path: {{ $minioPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "testplanit.minio.fullname" . }}
                port:
                  number: 9000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svc }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
