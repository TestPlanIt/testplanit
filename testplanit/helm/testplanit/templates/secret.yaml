{{- if not .Values.secrets.existingSecret }}
{{- /*
  Resolve each generated secret with the standard "user value -> existing
  Secret value -> freshly generated" precedence so that ENCRYPTION_KEY and the
  bundled datastore passwords stay STABLE across `helm upgrade`. `lookup` is
  empty during `helm template`/dry-run and on the first install, in which case
  values are generated.
*/ -}}
{{- $secretName := printf "%s-env" (include "testplanit.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $old := dict }}
{{- if and $existing $existing.data }}{{ $old = $existing.data }}{{ end }}

{{- $nextauthSecret := .Values.secrets.nextauthSecret }}
{{- if not $nextauthSecret }}{{ $nextauthSecret = (index $old "NEXTAUTH_SECRET" | default "" | b64dec) }}{{ end }}
{{- if not $nextauthSecret }}{{ $nextauthSecret = randAlphaNum 48 }}{{ end }}

{{- $encryptionKey := .Values.secrets.encryptionKey }}
{{- if not $encryptionKey }}{{ $encryptionKey = (index $old "ENCRYPTION_KEY" | default "" | b64dec) }}{{ end }}
{{- if not $encryptionKey }}{{ $encryptionKey = (randAlphaNum 64 | sha256sum) }}{{ end }}

{{- $pgPassword := .Values.postgresql.auth.password }}
{{- if not $pgPassword }}{{ $pgPassword = (index $old "POSTGRES_PASSWORD" | default "" | b64dec) }}{{ end }}
{{- if not $pgPassword }}{{ $pgPassword = randAlphaNum 32 }}{{ end }}

{{- $minioPassword := .Values.objectStorage.minio.auth.rootPassword }}
{{- if not $minioPassword }}{{ $minioPassword = (index $old "MINIO_ROOT_PASSWORD" | default "" | b64dec) }}{{ end }}
{{- if not $minioPassword }}{{ $minioPassword = randAlphaNum 32 }}{{ end }}

{{- /* Connection URLs (may embed credentials -> kept in the Secret). */ -}}
{{- $databaseUrl := "" }}
{{- $directDatabaseUrl := "" }}
{{- if .Values.postgresql.enabled }}
  {{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s?schema=public" .Values.postgresql.auth.username $pgPassword (include "testplanit.postgresql.fullname" .) .Values.postgresql.auth.database }}
{{- else }}
  {{- $databaseUrl = required "postgresql.external.url is required when postgresql.enabled=false" .Values.postgresql.external.url }}
  {{- $directDatabaseUrl = .Values.postgresql.external.directUrl }}
{{- end }}

{{- $valkeyUrl := "" }}
{{- if .Values.redis.enabled }}
  {{- $valkeyUrl = printf "valkey://%s:6379" (include "testplanit.redis.fullname" .) }}
{{- else }}
  {{- $valkeyUrl = required "redis.external.url is required when redis.enabled=false" .Values.redis.external.url }}
{{- end }}

{{- /* Object storage credentials. */ -}}
{{- $awsKey := "" }}
{{- $awsSecret := "" }}
{{- if .Values.objectStorage.minio.enabled }}
  {{- $awsKey = .Values.objectStorage.minio.auth.rootUser }}
  {{- $awsSecret = $minioPassword }}
{{- else }}
  {{- $awsKey = .Values.objectStorage.external.accessKeyId }}
  {{- $awsSecret = .Values.objectStorage.external.secretAccessKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "testplanit.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  NEXTAUTH_SECRET: {{ $nextauthSecret | quote }}
  ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- if $directDatabaseUrl }}
  DIRECT_DATABASE_URL: {{ $directDatabaseUrl | quote }}
  {{- end }}
  VALKEY_URL: {{ $valkeyUrl | quote }}
  {{- if $awsKey }}
  AWS_ACCESS_KEY_ID: {{ $awsKey | quote }}
  {{- end }}
  {{- if $awsSecret }}
  AWS_SECRET_ACCESS_KEY: {{ $awsSecret | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.emailPassword }}
  EMAIL_SERVER_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  {{- end }}
  {{- if .Values.objectStorage.minio.enabled }}
  MINIO_ROOT_USER: {{ .Values.objectStorage.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $minioPassword | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
