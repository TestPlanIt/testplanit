apiVersion: v2
name: testplanit
description: |
  TestPlanIt — open-source test management platform. Single-tenant, self-hosted
  Helm chart for Kubernetes (EKS/GKE/AKS/k3s). Deploys the web app, background
  workers, and a one-shot migrate/seed job, with optional bundled PostgreSQL,
  Valkey, Elasticsearch, and MinIO that can each be swapped for managed services
  (RDS / ElastiCache / OpenSearch / S3).
type: application
# Chart version — tracks the app release line it ships against.
version: 1.0.0
# The application release this chart ships against. Surfaces on every object as
# the standard app.kubernetes.io/version label. Operators who pin `image.tag`
# to a different release should expect that label to reflect this value, not
# their override.
appVersion: "1.0.0"
kubeVersion: ">=1.25.0-0"
home: https://testplanit.com
sources:
  - https://github.com/testplanit/testplanit
keywords:
  - test-management
  - testing
  - qa
  - testplanit
maintainers:
  - name: TestPlanIt
    url: https://testplanit.com
annotations:
  category: Productivity
