events {
    worker_connections 1024;
}

http {
    # Use Docker's embedded DNS so upstream hostnames are re-resolved after
    # container restarts rather than cached from nginx startup.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Request timing (added 2026-08-12). The stock `combined` format records no
    # latency ANYWHERE, which is why diagnosing the runs-list request storm
    # needed per-thread CPU forensics rather than a log query.
    #
    #   rt  = $request_time           first byte in -> last byte out. Includes
    #                                 time spent talking to the client.
    #   urt = $upstream_response_time time waiting on the app member alone.
    #   ua  = $upstream_addr          which member served it, so per-member
    #                                 latency is greppable without needing the
    #                                 X-App-Member response header.
    #
    # Read rt against urt: a large rt with a small urt is a slow client or a big
    # body, not a slow app. Both are `-` for responses nginx generates itself
    # (/health, maintenance, error pages) since no upstream was involved.
    #
    # The three fields are APPENDED after the user-agent, so anything parsing
    # the old combined layout by quote-delimited position still works.
    log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time ua=$upstream_addr';

    # /var/log/nginx/access.log is a symlink to /dev/stdout in nginx:alpine, so
    # this keeps everything flowing to `docker logs` exactly as before — only the
    # line format changes. (That symlink is also why `tail`/`wc -l` on the file
    # block forever; read logs via the docker driver.)
    access_log /var/log/nginx/access.log timed;

    # HTTP-context overrides (local, not tracked). A slot is a PAIR of app
    # containers, and the `upstream` directive that balances across them is only
    # valid HERE, in http context -- not inside `server`, where the sibling
    # include below is loaded. deploy-testplanit.sh writes the group for the live
    # pair to nginx-local/http/upstream.conf.
    #
    # The two globs do not overlap: `local/*.conf` matches only files directly in
    # that directory, never the http/ subdirectory, so a server-context include
    # can never accidentally pull in an upstream block (which would fail
    # `nginx -t` with "upstream directive is not allowed here").
    #
    # A glob matching nothing is not an error, so this is a no-op before the
    # first pair-aware deploy writes the file.
    include /etc/nginx/local/http/*.conf;

    server {
        listen 80;
        server_name _;

        set $app_upstream    http://prod:3000;
        set $minio_upstream  http://minio:9000;

        # Optional per-deployment overrides (e.g. custom error pages). Drop *.conf
        # files into ./nginx-local (bind-mounted at /etc/nginx/local, gitignored);
        # see nginx-local/README.md. No-op when the directory is empty. This does
        # NOT enable proxy_intercept_errors, so app responses pass through
        # untouched — an included file can only restyle nginx-generated errors.
        include /etc/nginx/local/*.conf;

        # Maintenance mode - returns 503 if /etc/nginx/maintenance.json exists
        error_page 503 @maintenance;

        location @maintenance {
            root /etc/nginx;
            rewrite ^(.*)$ /maintenance.html break;
        }

        # Serve maintenance config file
        location = /maintenance.json {
            root /etc/nginx;
            add_header Content-Type application/json;
        }

        # Check for maintenance mode file
        set $maintenance 0;
        if (-f /etc/nginx/maintenance.json) {
            set $maintenance 1;
        }

        # Allow health checks during maintenance
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy MinIO requests (bucket operations)
        location /testplanit/ {
            # NOTE: with a variable in proxy_pass, nginx does NOT auto-append the
            # unmatched URI, so we must omit the URI part and let the full request
            # URI (/testplanit/<object-key>) pass through unchanged.
            proxy_pass $minio_upstream;
            # Forward original host header unchanged for AWS signature validation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;

            # Generous timeouts so a slow multi-GB upload isn't killed mid-stream.
            # NOTE: these are INACTIVITY timeouts (reset on every chunk), not a
            # cap on total transfer time — a steady upload never trips them.
            # client_body_timeout (default 60s) is the one that matters most for
            # receiving the browser's upload body; raise it too.
            proxy_connect_timeout 60s;
            proxy_send_timeout 86400s;
            proxy_read_timeout 86400s;
            client_body_timeout 86400s;
            send_timeout 86400s;

            # MinIO specific headers for S3 API compatibility
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # No body-size cap for object uploads — large Testmo exports (multi-GB)
            # are streamed straight through to MinIO (request buffering is off).
            client_max_body_size 0;

            # Handle CORS for file uploads
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
        
        # Keep old MinIO path for compatibility
        location /minio/ {
            # Strip the /minio/ prefix before forwarding (variable proxy_pass
            # needs an explicit rewrite to rewrite the upstream URI).
            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass $minio_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 0;
        }

        # Proxy all other requests to TestPlanIt app
        location / {
            # Return 503 if in maintenance mode
            if ($maintenance = 1) {
                return 503;
            }

            proxy_pass $app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Important for OAuth callbacks and cookies
            proxy_set_header Cookie $http_cookie;
            proxy_pass_header Set-Cookie;
            
            # Disable buffering for real-time responses
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Increase buffer sizes for OAuth POST callbacks
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # Increase timeouts for OAuth operations
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            
            # Handle large POST bodies from Apple Sign In
            client_max_body_size 10M;
            client_body_buffer_size 128k;
        }
    }
}